<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎾 Ranking de Tênis - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
        }

        .auth-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: var(--text-light);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Form Group */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: var(--text);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        input[type="password"] {
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        /* Phone Input */
        .phone-input-group {
            display: flex;
            gap: 10px;
        }

        .country-select {
            width: 100px !important;
        }

        .phone-number {
            flex: 1 !important;
        }

        /* Buttons */
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Auth Switch */
        .auth-switch {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-light);
        }

        .auth-switch button {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            padding: 0;
        }

        .auth-switch button:hover {
            text-decoration: underline;
        }

        /* Alert */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        .alert.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #dc2626;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #3b82f6;
        }

        /* Password Toggle */
        .password-toggle {
            position: relative;
        }

        .password-toggle input {
            padding-right: 40px;
        }

        .password-toggle button {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            font-size: 18px;
            padding: 0;
        }

        /* Loading State */
        .btn.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .btn.loading::after {
            content: '';
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-light);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }

            .auth-logo {
                font-size: 40px;
            }

            .auth-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-logo">🎾</div>
                <h1 class="auth-title">Ranking de Tênis</h1>
                <p class="auth-subtitle">Sua cidade em movimento</p>
            </div>

            <!-- Alert Container -->
            <div id="alertContainer"></div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <div class="password-toggle">
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                        <button type="button" onclick="togglePasswordVisibility('loginPassword')">👁️</button>
                    </div>
                </div>

                <button type="button" class="btn btn-primary" onclick="login()">Entrar na Conta</button>

                <div class="auth-switch">
                    <p>Não tem conta? <button type="button" onclick="switchForm('register')">Criar conta</button></p>
                </div>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="registerName" placeholder="João Silva" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label>WhatsApp</label>
                    <div class="phone-input-group">
                        <select id="countryCode" class="country-select">
                            <option value="+55">🇧🇷 Brasil</option>
                            <option value="+1">🇺🇸 USA</option>
                            <option value="+52">🇲🇽 México</option>
                            <option value="+351">🇵🇹 Portugal</option>
                            <option value="+34">🇪🇸 Espanha</option>
                            <option value="+54">🇦🇷 Argentina</option>
                            <option value="+56">🇨🇱 Chile</option>
                            <option value="+57">🇨🇴 Colômbia</option>
                            <option value="+51">🇵🇪 Peru</option>
                            <option value="+33">🇫🇷 França</option>
                            <option value="+39">🇮🇹 Itália</option>
                            <option value="+49">🇩🇪 Alemanha</option>
                            <option value="+44">🇬🇧 Reino Unido</option>
                            <option value="+61">🇦🇺 Austrália</option>
                            <option value="+81">🇯🇵 Japão</option>
                            <option value="+86">🇨🇳 China</option>
                            <option value="+91">🇮🇳 Índia</option>
                            <option value="+27">🇿🇦 África do Sul</option>
                        </select>
                        <input type="tel" id="registerPhone" class="phone-number" placeholder="99999-9999" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Data de Nascimento</label>
                    <input type="date" id="registerBirthDate" required>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <div class="password-toggle">
                        <input type="password" id="registerPassword" placeholder="••••••••" required>
                        <button type="button" onclick="togglePasswordVisibility('registerPassword')">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirmar Senha</label>
                    <div class="password-toggle">
                        <input type="password" id="registerPasswordConfirm" placeholder="••••••••" required>
                        <button type="button" onclick="togglePasswordVisibility('registerPasswordConfirm')">👁️</button>
                    </div>
                </div>

                <button type="button" class="btn btn-primary" onclick="register()">Criar Conta</button>

                <div class="auth-switch">
                    <p>Já tem conta? <button type="button" onclick="switchForm('login')">Entrar</button></p>
                </div>
            </form>

            <!-- Footer -->
            <div class="auth-footer">
                <p>Ao criar uma conta, você concorda com nossos<br><a href="#">Termos de Serviço</a> e <a href="#">Política de Privacidade</a></p>
            </div>
        </div>
    </div>

    <script>
        // ===== CONFIGURAÇÃO SUPABASE =====
        const SUPABASE_URL = 'https://abqgzrwnyszmasrergqe.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFicWd6cndueXN6bWFzcmVyZ3FlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3MDU4ODcsImV4cCI6MjA4NTI4MTg4N30.Gl_gIt_eqEG8tqA_ASHconKnLQEElFBIor1I1kU3K2M';
        
        const { createClient } = window.supabase;
        const authSupabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ===== INICIALIZAÇÃO =====
        async function init() {
            const { data: { session } } = await authSupabase.auth.getSession();
            if (session) {
                // Se já está logado, redireciona para o app
                window.location.href = 'app.html';
            }
        }

        // ===== NAVEGAÇÃO ENTRE FORMS =====
        function switchForm(form) {
            document.getElementById('loginForm').classList.remove('active');
            document.getElementById('registerForm').classList.remove('active');
            
            if (form === 'login') {
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.getElementById('registerForm').classList.add('active');
            }

            clearAlerts();
            clearForms();
        }

        // ===== LOGIN =====
        async function login() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showAlert('Preencha email e senha!', 'error');
                return;
            }

            const btn = event.target;
            btn.classList.add('loading');

            try {
                const { data, error } = await authSupabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    showAlert('Email ou senha inválidos!', 'error');
                } else {
                    showAlert('Login realizado! Redirecionando...', 'success');
                    setTimeout(() => {
                        window.location.href = 'app.html';
                    }, 1500);
                }
            } catch (err) {
                showAlert('Erro ao fazer login: ' + err.message, 'error');
            } finally {
                btn.classList.remove('loading');
            }
        }

        // ===== CADASTRO =====
      async function register() {
    const name = document.getElementById('registerName').value.trim();
    const email = document.getElementById('registerEmail').value.trim();
    const countryCode = document.getElementById('countryCode').value;
    const phone = countryCode + document.getElementById('registerPhone').value.trim();
    const birthDate = document.getElementById('registerBirthDate').value;
    const password = document.getElementById('registerPassword').value;
    const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

    // Validações
    if (!name || !email || !phone || !birthDate || !password || !passwordConfirm) {
        showAlert('Preencha todos os campos!', 'error');
        return;
    }

    if (name.length < 3) {
        showAlert('Nome deve ter no mínimo 3 caracteres!', 'error');
        return;
    }

    if (password.length < 6) {
        showAlert('Senha deve ter no mínimo 6 caracteres!', 'error');
        return;
    }

    if (password !== passwordConfirm) {
        showAlert('Senhas não conferem!', 'error');
        return;
    }

    const btn = event.target;
    btn.classList.add('loading');

    try {
        // Criar usuário COM METADADOS (para trigger pegar)
        const { data, error: authError } = await authSupabase.auth.signUp({
            email,
            password,
            options: {
                data: {
                    full_name: name,
                    phone: phone,
                    birth_date: birthDate
                }
            }
        });

        if (authError) {
            showAlert('Erro ao cadastrar: ' + authError.message, 'error');
            btn.classList.remove('loading');
            return;
        }

        // ✅ TRIGGER automático cria profiles - sem INSERT manual!

        showAlert('Cadastro realizado! Confirme seu email e faça login.', 'success');
        setTimeout(() => {
            switchForm('login');
        }, 2000);

    } catch (err) {
        showAlert('Erro ao cadastrar: ' + err.message, 'error');
    } finally {
        btn.classList.remove('loading');
    }
}


        // ===== UTILITÁRIOS =====
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            container.innerHTML = '';
            container.appendChild(alert);

            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        function clearAlerts() {
            document.getElementById('alertContainer').innerHTML = '';
        }

        function clearForms() {
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();
            document.getElementById('countryCode').value = '+55';
        }

        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const btn = event.target;
            
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // Inicializar
        init();
    </script>
</body>
</html>
